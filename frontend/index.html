<!DOCTYPE html>
<html lang="de" class="antialiased">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LifeRadar</title>
  
  <!-- Prevent theme flash on startup -->
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('liferadar-theme');
        var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (theme === 'dark' || (theme === 'system' && supportDarkMode) || (!theme && supportDarkMode)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) {}
    })();
  </script>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['var(--font-sans)'],
          },
          colors: {
            slate: {
              850: '#151e2e',
              900: '#0f172a',
            }
          }
        }
      }
    }
  </script>

  <!-- Import Map with pinned dependency versions -->
    
  <style>
    :root {
      /* Centralized typography tokens using fallback stack. Local Manrope files required for production. */
      --font-sans: 'Manrope', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    /* Prevent flash of unstyled content and handle basic resets */
    body {
      margin: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: var(--font-sans);
    }
    /* Custom scrollbar for a cleaner look */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.3);
      border-radius: 3px;
    }
    .dark ::-webkit-scrollbar-thumb {
      background: rgba(71, 85, 105, 0.5);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 dark:bg-slate-900 dark:text-slate-50 transition-colors duration-200">
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
